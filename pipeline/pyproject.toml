[project]
name = "touchdown-pipeline"
version = "0.1.0"
description = "Offline NASA LOLA DEM and JPL Horizons data pipeline for TOUCHDOWN"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1,<3",
  "pillow>=11,<12",
]

[project.scripts]
touchdown-build = "touchdown_pipeline.build_data:main"
touchdown-moon-textures = "touchdown_pipeline.moon_textures:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/touchdown_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
